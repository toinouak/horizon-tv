<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
  <title>Horizon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="bgA" class="bg"></div>
    <div id="bgB" class="bg"></div>
    <div id="shade"></div>

    <div id="credit">
      <div id="creditPlace"></div>
      <div id="creditSource"></div>
    </div>

    <div id="clock">
      <div id="time"></div>
      <div id="date"></div>
    </div>

    <div id="home">
      <div id="caption"></div>
      <div id="dock"><div id="dockTrack"></div></div>
      <div id="hint">
        <span class="chev">&#8964;</span> Toutes les applis
        <span class="dot">&middot;</span> Maintenir OK : options
      </div>
    </div>

    <div id="drawer">
      <div id="drawerHead">
        <div id="drawerTitle">Toutes les applis</div>
        <div id="drawerHint">Maintenir OK pour ajouter au dock ou masquer &middot; Retour pour fermer</div>
      </div>
      <div id="gridViewport"><div id="grid"></div></div>
    </div>

    <div id="menu">
      <div id="menuBox">
        <div id="menuTitle"></div>
        <div id="menuList"></div>
      </div>
    </div>

    <div id="toast"></div>
  </div>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
